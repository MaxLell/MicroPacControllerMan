# ST-LINK V3E + STM32U5 target (STM32U545RE-Q Nucleo-64) — DEBUG ONLY.
#
# Debug:  openocd -f openocd.cfg   (then connect gdb to :3333)
#
# Flashing is done with STM32CubeProgrammer, not with this file:
#
#   STM32_Programmer_CLI -c port=SWD -w build/pacman.elf -v -rst
#
# openocd 0.12.0 attaches to this part fine (it detects the Cortex-M33), but its
# flash driver only knows STM32U57/U58xx (device ID 0x482). This board reports
# 0x455 (STM32U535/U545), so `program` fails with "auto_probe failed". U535/U545
# support landed after 0.12.0, which is the newest version Ubuntu noble ships.

source [find interface/stlink.cfg]
source [find target/stm32u5x.cfg]
