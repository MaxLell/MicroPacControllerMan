# ST-LINK V3E + STM32U5 target (STM32U545RE-Q Nucleo-64)
#
# Debug:  openocd -f openocd.cfg   (then connect gdb to :3333)   -- works
# Flash:  NOT with openocd 0.12.0. It attaches fine (generic Cortex-M33) but its
#         flash driver only knows STM32U57/U58xx (device ID 0x482); this board
#         reports 0x455 (STM32U535/U545), so `program` fails with "auto_probe
#         failed". U535/U545 support landed after 0.12.0. Use pyOCD until the
#         flash tool is decided:
#           pyocd flash --target stm32u545retxq build/pacman.elf

source [find interface/stlink.cfg]
source [find target/stm32u5x.cfg]
